apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rs
  namespace: it
  labels:
    team: Product
    version: 1.1.3
    environment: development
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nginx-withrsnew
  template:
    metadata:
      labels:
        app: nginx-withrsnew
    spec:
      containers:
        - name: nginx-withrsnew
          image: saintshiro16/my-nginx-site:4b4e2c4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: service-nginx
  namespace: it
spec:
  type: ClusterIP
  selector:
    app: nginx-withrsnew
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: it
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      secretName: app-civo-tls
  rules:
    - host: app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nginx
                port:
                  number: 80