apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-redirect-config
  namespace: it
data:
  default.conf: |
    server_names_hash_bucket_size 128;

    # ── Rate limiting zone (context http, valid di sini karena
    #    default.conf di-include di dalam block http oleh nginx.conf bawaan) ──
    # 10r/s per IP, burst 20 -> cukup longgar untuk user asli,
    # tapi bikin scanner/bot (feroxbuster dkk) langsung kena limit.
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com;

        # Batasi koneksi simultan per IP
        limit_conn conn_limit 20;

        # ── Blokir file/folder sensitif ──
        # Ditaruh SEBELUM location / supaya jelas dibaca,
        # meski secara matching nginx regex location tetap
        # override prefix location / walau ditaruh di bawah.
        location ~ /\.(git|github|env) {
            deny all;
            return 404;
        }

        location ~* \.(ya?ml|md)$ {
            deny all;
            return 404;
        }

        location = /Dockerfile {
            deny all;
            return 404;
        }

        location / {
            # Rate limit request umum
            limit_req zone=general_limit burst=20 nodelay;

            # Paksa HTTPS (kalau request belum lewat TLS di edge/Traefik)
            if ($http_x_forwarded_proto != "https") {
                return 301 https://$host$request_uri;
            }

            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }

    # Catch-all: kalau ada yang akses lewat IP publik langsung
    # (Host header tidak cocok server_name di atas) -> redirect ke domain resmi.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com$request_uri;
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rs
  namespace: it
  labels:
    team: Product
    version: 1.1.3
    environment: development
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nginx-withrsnew
  template:
    metadata:
      labels:
        app: nginx-withrsnew
    spec:
      containers:
        - name: nginx-withrsnew
          image: saintshiro16/my-nginx-site:4b4e2c4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-redirect-config

---

apiVersion: v1
kind: Service
metadata:
  name: service-nginx
  namespace: it
spec:
  type: ClusterIP
  selector:
    app: nginx-withrsnew
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

# Catatan: Middleware Traefik (rate limit di level edge) TIDAK dipakai
# di sini karena CRD `middlewares.traefik.io` belum ke-install di cluster
# ini (`kubectl get crd | grep traefik` kosong). Rate limiting cukup
# diandelin dari nginx (limit_req_zone di ConfigMap di atas) - itu udah
# efektif buat nahan scanner/bot. Kalau nanti mau proteksi di edge juga,
# install dulu Traefik CRDs:
#   kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v3.1/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
# baru tambahin resource Middleware + annotation router.middlewares lagi.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: it
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      secretName: app-civo-tls
  rules:
    - host: app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nginx
                port:
                  number: 80

  # Catatan: rule kedua (tanpa `host:`) sengaja DIHAPUS dari versi ini.
  # Rule tanpa host itu catch-all di level Traefik -> Traefik tetap
  # terminate TLS & forward request buat Host apa pun (termasuk IP publik
  # atau domain traefik.default internal) ke service-nginx.
  # Redirect 301 di nginx (server block catch-all di atas) SUDAH cukup
  # nanganin kasus akses lewat IP, jadi rule ini gak perlu dobel di Ingress.
  # Kalau memang butuh akses via IP buat health check LB Civo, tambahin lagi
  # rule ini TAPI dibatasi pakai Middleware ipAllowList (CIDR internal saja).