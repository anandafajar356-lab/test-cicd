apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-redirect-config
  namespace: it
data:
  default.conf: |
    server_names_hash_bucket_size 128;

    server {
        listen 80;
        server_name app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com;

        location / {
            if ($http_x_forwarded_proto != "https") {
                return 301 https://$host$request_uri;
            }

            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }

    # Catch-all: Jika akses lewat IP Public langsung -> redirect ke domain HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com$request_uri;
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-rs
  namespace: it
  labels:
    team: Product
    version: 1.1.3
    environment: development
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nginx-withrsnew
  template:
    metadata:
      labels:
        app: nginx-withrsnew
    spec:
      containers:
        - name: nginx-withrsnew
          image: saintshiro16/my-nginx-site:4b4e2c4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-redirect-config

---

apiVersion: v1
kind: Service
metadata:
  name: service-nginx
  namespace: it
spec:
  type: ClusterIP
  selector:
    app: nginx-withrsnew
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: it
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      secretName: app-civo-tls
  rules:
    - host: app.6cfc738b-ced1-4334-8cd1-cfa279e71cda.k8s.civo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nginx
                port:
                  number: 80
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-nginx
                port:
                  number: 80